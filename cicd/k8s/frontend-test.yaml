apiVersion: v1
kind: Namespace
metadata:
  name: ruoyi-vue3-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-web
  namespace: ruoyi-vue3-test
  labels:
    app: ruoyi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-web
  template:
    metadata:
      labels:
        app: ruoyi-web
    spec:
      containers:
        - name: ruoyi-web
          image: ghcr.io/zhuyifeiruichuang/ruoyi-vue3/ruoyi-web:__VERSION__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-web
  namespace: ruoyi-vue3-test
spec:
  selector:
    app: ruoyi-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
