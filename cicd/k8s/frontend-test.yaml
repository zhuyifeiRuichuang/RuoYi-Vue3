apiVersion: v1
kind: Namespace
metadata:
  name: ruoyi-vue3-test
---
# 前端 nginx 配置要求存在 ruoyi-gateway upstream；部署测试仅验证前端本身，
# 因此部署一个总是返回 200 的 mock 网关 Service，使 nginx 能正常启动。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: ruoyi-vue3-test
  labels:
    app: ruoyi-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-gateway
  template:
    metadata:
      labels:
        app: ruoyi-gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: mock-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: mock-config
          configMap:
            name: ruoyi-gateway-mock
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruoyi-gateway-mock
  namespace: ruoyi-vue3-test
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        location / {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
  namespace: ruoyi-vue3-test
spec:
  selector:
    app: ruoyi-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-web
  namespace: ruoyi-vue3-test
  labels:
    app: ruoyi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-web
  template:
    metadata:
      labels:
        app: ruoyi-web
    spec:
      containers:
        - name: ruoyi-web
          image: ghcr.io/zhuyifeiruichuang/ruoyi-vue3/ruoyi-web:__VERSION__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-web
  namespace: ruoyi-vue3-test
spec:
  selector:
    app: ruoyi-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
