name: Build Frontend Image (RuoYi-Vue3)

# 全手动触发：使用 release-frontend 产出的 dist 压缩包，构建多架构前端镜像并推送到 ghcr.io
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version must match the existing Release tag exactly, e.g. dev-3.9.2'
        required: true
        default: 'dev-3.9.2'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ inputs.version }}" -D artifacts --repo "${{ github.repository }}"
          unzip -o artifacts/ruoyi-web-dist.zip -d dist

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/ruoyi-web"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file cicd/docker/frontend/Dockerfile \
            --tag "${IMAGE}:${{ inputs.version }}" \
            --tag "${IMAGE}:latest" \
            --provenance=false \
            --push .

      - name: Make package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/user/packages/container/ruoyi-vue3%2Fruoyi-web/visibility" -f visibility=public || true
